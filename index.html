<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gate7 - Gestão e Gamificação</title>
    <meta name="theme-color" content="#6d28d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gate7" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <script>
      window.process = window.process || {};
      window.process.env = window.process.env || {};
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Anti-FOUC (Flash of Unstyled Content) script for Dark Mode
      (function() {
        try {
          var saved = localStorage.getItem('darkMode');
          if (saved === 'true') {
            document.documentElement.classList.add('dark');
          } else if (saved === 'false') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
