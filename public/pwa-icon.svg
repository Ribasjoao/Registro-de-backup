<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0926" />
    </linearGradient>
    <!-- Accent Purple Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Rounded App Icon Shape -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#374151" stroke-width="6" />

  <!-- Inner Portal Hexagon Grid Accent -->
  <g opacity="0.15">
    <polygon points="256,60 416,150 416,330 256,420 96,330 96,150" fill="none" stroke="#8b5cf6" stroke-width="4" />
    <polygon points="256,100 376,170 376,310 256,380 136,310 136,170" fill="none" stroke="#8b5cf6" stroke-width="2" />
  </g>

  <!-- Stylized Portal Gateway Frame -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="url(#brandGrad)" stroke-width="12" filter="url(#glow)" stroke-linecap="round" stroke-dasharray="640 160" transform="rotate(-45 256 240)" />

  <!-- Gate 7 Glowing Character Element -->
  <g filter="url(#glow)">
    <!-- Elegant stylized number 7 constructed using dynamic polygons -->
    <path d="M190 160 H320 L220 340 H180 L260 200 H190 Z" fill="url(#brandGrad)" />
    <!-- Dynamic futuristic cross-bar representing the 'Gate' concept or division -->
    <path d="M165 235 L335 220" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Core Interactive Dots -->
  <circle cx="256" cy="100" r="10" fill="#fbbf24" />
  <circle cx="116" cy="240" r="6" fill="#a78bfa" opacity="0.8" />
  <circle cx="396" cy="240" r="6" fill="#a78bfa" opacity="0.8" />
  <circle cx="256" cy="380" r="8" fill="#8b5cf6" opacity="0.9" />

  <!-- Subtle Brand Name Baseplate -->
  <text x="256" y="445" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="32" font-weight="700" fill="#f8fafc" letter-spacing="6" text-anchor="middle">GATE7</text>
</svg>
